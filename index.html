<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Cross-Playlist Jukebox</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Legit 8-Bit Hanging Curtains */
        .curtain {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 16vw;
            min-width: 120px;
            max-width: 260px;
            background-color: #5c1d24; /* Deep Arcade Red */
            /* 8-bit vertical drape pleats using sharp pixel gradients */
            background-image: 
                linear-gradient(90deg, #2b0b0e 15%, transparent 15%, transparent 30%, #8c2e38 30%, #8c2e38 45%, #2b0b0e 45%, #2b0b0e 60%, transparent 60%, transparent 75%, #421217 75%);
            background-size: 40px 100%;
            border-bottom: 8px solid #1a0507;
            z-index: 100;
            pointer-events: none;
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.6);
        }
        .curtain.left { 
            left: 0; 
            border-right: 8px solid #1a0507;
        }
        .curtain.right { 
            right: 0; 
            border-left: 8px solid #1a0507;
            transform: scaleX(-1); /* Flips pleats symmetrically */
        }

        /* Top 8-bit Valance Fringe */
        .curtain::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 24px;
            background-color: #8c2e38;
            background-image: linear-gradient(90deg, #1a0507 50%, #5c1d24 50%);
            background-size: 16px 16px;
            border-bottom: 4px solid #1a0507;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 760px;
            max-width: 100%;
            gap: 16px;
            z-index: 1;
        }
        .player-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .now-playing-banner {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 14px;
            color: #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        .now-playing-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
            flex: 1;
            margin-right: 15px;
        }
        .now-playing-banner span.label {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .now-playing-banner span.playlist-name {
            font-size: 13px;
            font-weight: bold;
            color: #5b9bd5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .now-playing-banner span.title {
            font-size: 14px;
            font-weight: bold;
            color: #ff7777;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #161616;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #333;
            border-top: 3px solid #ff0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 14px;
            color: #aaa;
            font-family: monospace;
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .control-panel.collapsed {
            padding: 12px 20px;
        }
        .control-panel.collapsed #input-container {
            display: none;
        }
        .control-panel.collapsed .helper-text {
            display: none;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #121212;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #2ecc71;
        }
        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background-color: #2ecc71;
            color: black;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #27ae60;
        }
        button.secondary {
            background-color: #333;
            color: white;
            padding: 8px 14px;
            font-size: 13px;
        }
        button.secondary:hover {
            background-color: #444;
        }
        .helper-text {
            font-size: 13px;
            color: #bbb;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- 8-Bit Arcade Curtains -->
    <div class="curtain left"></div>
    <div class="curtain right"></div>

    <div class="main-layout">
        <!-- Player & Controls Section -->
        <div class="player-section">
            <div class="now-playing-banner">
                <div class="now-playing-info">
                    <span class="label">Now Playing</span>
                    <span id="current-playlist-name" class="playlist-name">Playlist: --</span>
                    <span id="current-song-title" class="title">Waiting for playback to begin...</span>
                </div>
                <button class="secondary" onclick="playRandomMasterTrack()" title="Skip to a random track">Next ▶▶</button>
            </div>

            <div id="player-container">
                <div id="loading-overlay" class="hidden">
                    <div class="spinner"></div>
                    <span id="overlay-status" class="loading-text">Indexing playlists...</span>
                </div>
                <div id="youtube-player"></div>
            </div>

            <div id="control-panel" class="control-panel">
                <div class="button-row">
                    <span id="status-display" class="helper-text">Ready.</span>
                    <button onclick="initJukebox()">Go Go Radio!</button>
                </div>
                <div id="input-container">
                    <p class="helper-text">Paste your Playlist URLs (one per line):</p>
                    <textarea id="playlist-input" placeholder="https://www.youtube.com/playlist?list=PLxxxxxxxx...&#10;https://www.youtube.com/playlist?list=PLyyyyyyyy..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API Script Loader -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        let playlistPool = [];
        let masterTrackPool = [];
        let currentPlaylistIndex = 0;
        let isJukeboxActive = false;
        let titleInterval = null;
        let playlistNamesMap = {};

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'enablejsapi': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function extractPlaylistId(input) {
            input = input.trim();
            if (input.includes('list=')) {
                try {
                    const url = new URL(input.startsWith('http') ? input : 'https://www.youtube.com' + input);
                    return url.searchParams.get('list');
                } catch (e) {
                    return null;
                }
            }
            return input.length > 5 ? input : null;
        }

        // Automatically format pasted URLs onto new lines
        document.getElementById('playlist-input').addEventListener('paste', function(e) {
            setTimeout(() => {
                let val = this.value;
                let cleaned = val.split(/[\r\n]+/)
                                 .map(line => line.trim())
                                 .filter(Boolean)
                                 .join('\n');
                if (cleaned && !cleaned.endsWith('\n')) {
                    cleaned += '\n';
                }
                this.value = cleaned;
                this.scrollTop = this.scrollHeight;
            }, 10);
        });

        function initJukebox() {
            const rawText = document.getElementById('playlist-input').value;
            const lines = rawText.split(/[\n,]+/);
            playlistPool = lines.map(item => extractPlaylistId(item)).filter(Boolean);
            playlistPool = [...new Set(playlistPool)];

            if (playlistPool.length === 0) {
                alert('Please enter at least one valid playlist URL.');
                return;
            }

            isJukeboxActive = true;
            masterTrackPool = [];
            currentPlaylistIndex = 0;
            playlistNamesMap = {};
            
            if (player && typeof player.mute === 'function') {
                player.mute();
            }

            const overlay = document.getElementById('loading-overlay');
            overlay.classList.remove('hidden');
            document.getElementById('overlay-status').innerText = `Indexing playlist 1 of ${playlistPool.length}...`;
            document.getElementById('status-display').innerText = `Indexing playlists...`;

            loadNextPlaylistForIndexing();
        }

        function loadNextPlaylistForIndexing() {
            if (currentPlaylistIndex < playlistPool.length) {
                document.getElementById('overlay-status').innerText = `Indexing playlist ${currentPlaylistIndex + 1} of ${playlistPool.length}...`;
                const targetId = playlistPool[currentPlaylistIndex];
                player.loadPlaylist({
                    list: targetId,
                    listType: 'playlist',
                    index: 0
                });
                setTimeout(harvestTracksFromCurrentPlayer, 1500);
            } else {
                FINALIZE_INDEXING();
            }
        }

        function harvestTracksFromCurrentPlayer() {
            try {
                const fetchedTracks = player.getPlaylist();
                const activePlaylistId = playlistPool[currentPlaylistIndex];
                let playlistTitle = `Playlist ${currentPlaylistIndex + 1}`;

                try {
                    const data = player.getVideoData();
                    if (data && data.listTitle && data.listTitle !== "") {
                        playlistTitle = data.listTitle;
                    }
                } catch(err) {}

                playlistNamesMap[activePlaylistId] = playlistTitle;

                if (fetchedTracks && Array.isArray(fetchedTracks)) {
                    fetchedTracks.forEach(vId => {
                        masterTrackPool.push({
                            videoId: vId,
                            playlistId: activePlaylistId
                        });
                    });
                }
            } catch (e) {
                console.log('Error harvesting playlist:', e);
            }

            currentPlaylistIndex++;
            if (currentPlaylistIndex < playlistPool.length) {
                loadNextPlaylistForIndexing();
            } else {
                FINALIZE_INDEXING();
            }
        }

        function FINALIZE_INDEXING() {
            const seen = new Set();
            masterTrackPool = masterTrackPool.filter(item => {
                if (seen.has(item.videoId)) return false;
                seen.add(item.videoId);
                return true;
            });
            
            if (player && typeof player.unMute === 'function') {
                player.unMute();
            }

            document.getElementById('loading-overlay').classList.add('hidden');
            
            if (masterTrackPool.length > 0) {
                // Fold up the URL input box
                document.getElementById('control-panel').classList.add('collapsed');
                playRandomMasterTrack();
            } else {
                alert('Could not index tracks. Make sure the playlist links are public.');
            }
        }

        function playRandomMasterTrack() {
            if (!isJukeboxActive || masterTrackPool.length === 0) return;

            const randomIndex = Math.floor(Math.random() * masterTrackPool.length);
            const targetTrack = masterTrackPool[randomIndex];

            document.getElementById('status-display').innerText = `Tracks: ${masterTrackPool.length}`;
            
            let resolvedName = playlistNamesMap[targetTrack.playlistId] || 'Unknown Playlist';
            document.getElementById('current-playlist-name').innerText = resolvedName;

            player.loadVideoById(targetTrack.videoId);
            fetchVideoTitle();
        }

        function fetchVideoTitle() {
            if (titleInterval) clearInterval(titleInterval);
            
            let attempts = 0;
            titleInterval = setInterval(() => {
                attempts++;
                try {
                    const data = player.getVideoData();
                    if (data && data.title && data.title !== "") {
                        document.getElementById('current-song-title').innerText = data.title;
                        if (data.listTitle && data.listTitle !== "") {
                            playlistNamesMap[playlistPool[currentPlaylistIndex - 1] || playlistPool[0]] = data.listTitle;
                            document.getElementById('current-playlist-name').innerText = data.listTitle;
                        }
                        clearInterval(titleInterval);
                    }
                } catch (e) {}
                if (attempts > 20) {
                    clearInterval(titleInterval);
                }
            }, 300);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED && isJukeboxActive) {
                playRandomMasterTrack();
            }
        }
    </script>

</body>
</html>
