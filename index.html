<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🎧</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio M.Gorille</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Curtains */
        .curtain {
            position: fixed;
            top: 0; bottom: 0;
            width: 16vw;
            min-width: 120px;
            max-width: 260px;
            background-color: #5c1d24;
            z-index: 100;
            pointer-events: none;
            transition: width 0.3s ease;
        }
        .curtain.left { left: 0; border-right: 8px solid #1a0507; }
        .curtain.right { right: 0; border-left: 8px solid #1a0507; }

        @media (max-width: 768px) {
            .curtain { width: 10vw !important; min-width: 20px !important; }
        }

        .main-layout { 
            width: 100%; 
            max-width: 900px; 
            display: flex; 
            flex-direction: column; 
            z-index: 1; 
            align-items: center;
            /* Allow elements to shrink slightly before hitting hard stops */
            flex-shrink: 1;
            padding: 0 5vw;
        }

        .now-playing-banner { 
            width: 100%;
            background: #1e1e1e; 
            border: 1px solid #333; 
            border-radius: 8px; 
            padding: 10px 14px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 12px;
        }
        
        #player-container { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            position: relative; 
            margin-bottom: 12px;
        }

        /* Control Panel Logic */
        .control-panel { 
            width: 100%;
            background: #1e1e1e; 
            padding: 16px 20px; 
            border-radius: 12px; 
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        
        /* Default closed if in MG Mode */
        .control-panel.mg-active #input-container { display: none; }
        .control-panel.collapsed #input-container { display: none; }

        textarea { width: 100%; height: 80px; background: #121212; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 10px; box-sizing: border-box; }
        
        button { background-color: #2ecc71; color: black; border: none; padding: 10px 18px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="curtain left"></div>
    <div class="curtain right"></div>

    <div class="main-layout">
        <div class="now-playing-banner">
            <div>
                <span style="font-size: 11px; color: #888;">NOW PLAYING</span><br>
                <span id="current-song-title" style="color: #ff7777; font-weight: bold;">Waiting for playback...</span>
            </div>
            <button class="secondary" onclick="handleSkipButton()">Next ▶▶</button>
        </div>

        <div id="player-container">
            <div id="youtube-player"></div>
        </div>

        <div id="control-panel" class="control-panel">
            <div class="button-row" style="display:flex; justify-content: space-between; align-items:center;">
                <button class="toggle-btn" id="toggle-collapse-btn" onclick="toggleControlPanel()">▼</button>
                <button onclick="initJukebox()">Go Go Radio!</button>
            </div>
            <div id="input-container">
                <p style="font-size: 13px; color: #bbb;">Paste your Playlist URLs:</p>
                <textarea id="playlist-input"></textarea>
                <button id="mg-toggle" onclick="toggleMGorilleMode()" style="width:100%; margin-top:10px;">Radio M.Gorille</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let isMGMode = false;
        
        function toggleMGorilleMode() {
            isMGMode = !isMGMode;
            const panel = document.getElementById('control-panel');
            const btn = document.getElementById('mg-toggle');
            
            if (isMGMode) {
                panel.classList.add('mg-active');
                btn.innerText = "Radio M.Gorille: ON";
            } else {
                panel.classList.remove('mg-active');
                btn.innerText = "Radio M.Gorille";
            }
            initJukebox();
        }

        function toggleControlPanel() {
            document.getElementById('control-panel').classList.toggle('collapsed');
        }

        // ... (rest of your existing logic)
    </script>
</body>
</html>
