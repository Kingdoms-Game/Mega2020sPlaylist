<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🎧</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio M.Gorille</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* 8-Bit Curtains */
        .curtain {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 16vw;
            min-width: 120px;
            max-width: 260px;
            background-color: #5c1d24;
            background-image: linear-gradient(90deg, #2b0b0e 15%, transparent 15%, transparent 30%, #8c2e38 30%, #8c2e38 45%, #2b0b0e 45%, #2b0b0e 60%, transparent 60%, transparent 75%, #421217 75%);
            background-size: 40px 100%;
            border-bottom: 8px solid #1a0507;
            z-index: 100;
            pointer-events: none;
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.6);
        }
        .curtain.left { left: 0; border-right: 8px solid #1a0507; }
        .curtain.right { right: 0; border-left: 8px solid #1a0507; transform: scaleX(-1); }

        /* Dynamic Main Layout - Adjusts for curtains */
        .main-layout { 
            width: 100%; 
            max-width: 900px; 
            gap: 12px; 
            display: flex; 
            flex-direction: column; 
            z-index: 1; 
            align-items: center;
            /* Screen-size-dynamic margins to prevent curtain coverage */
            margin-left: 16vw;
            margin-right: 16vw;
        }

        @media (max-width: 768px) {
            .curtain { width: 14px !important; min-width: 14px !important; }
            .main-layout { margin-left: 20px; margin-right: 20px; }
            .curtain.left { border-right: 2px solid #1a0507; }
            .curtain.right { border-left: 2px solid #1a0507; transform: none; }
        }

        /* Control Panel Styles */
        .control-panel { 
            width: 100%;
            box-sizing: border-box;
            background: #1e1e1e; 
            padding: 16px 20px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            transition: all 0.3s ease; 
        }
        .control-panel.collapsed { padding: 10px 20px; }
        .control-panel.collapsed #input-container { display: none; }
        
        #click-hint { font-size: 13px; color: #666; font-style: italic; }
        
        /* Utility */
        .now-playing-banner { width: 100%; box-sizing: border-box; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
        #player-container { width: 100%; max-width: 1000px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; }
        button { background-color: #2ecc71; color: black; border: none; padding: 10px 18px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        textarea { width: 100%; height: 80px; background: #121212; color: #fff; border: 1px solid #444; padding: 10px; font-family: monospace; resize: vertical; }
    </style>
</head>
<body>

    <div class="curtain left"></div>
    <div class="curtain right"></div>

    <div class="main-layout">
        <div class="now-playing-banner">
            <div>
                <span style="font-size: 11px; color: #888;">Now Playing<span id="now-playing-mode" style="color: #2ecc71;"></span></span><br>
                <span id="current-song-title" style="font-size: 14px; font-weight: bold; color: #ff7777;">Waiting for playback...</span>
            </div>
            <button onclick="handleSkipButton()">Next ▶▶</button>
        </div>

        <div id="player-container">
            <div id="youtube-player"></div>
        </div>

        <div id="control-panel" class="control-panel collapsed">
            <div class="button-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button class="toggle-btn" id="toggle-collapse-btn" onclick="toggleControlPanel()" style="background:none; color:#bbb; border:none; cursor:pointer;">▼</button>
                    <span id="status-display" style="font-size: 13px; color: #bbb;">Ready.</span>
                    <span id="click-hint" style="font-size: 13px; color: #666; font-style: italic;">(click to add playlists)</span>
                </div>
                <button onclick="initJukebox()">Go Go Radio!</button>
            </div>
            <div id="input-container">
                <p style="font-size: 13px; color: #bbb; margin: 0 0 8px 0;">Paste your Playlist URLs:</p>
                <textarea id="playlist-input"></textarea>
                <button id="mg-toggle" onclick="toggleMGorilleMode()" style="width:100%; margin-top:10px;">Radio M.Gorille</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // ... (Keep existing JS logic here) ...

        function toggleControlPanel() { 
            const panel = document.getElementById('control-panel');
            const hint = document.getElementById('click-hint');
            panel.classList.toggle('collapsed'); 
            
            // Toggle hint visibility
            if (panel.classList.contains('collapsed')) {
                hint.style.display = 'inline';
            } else {
                hint.style.display = 'none';
            }
        }
        
        // Ensure hint is hidden if initialized as open
        if (!document.getElementById('control-panel').classList.contains('collapsed')) {
            document.getElementById('click-hint').style.display = 'none';
        }
    </script>
</body>
</html>
