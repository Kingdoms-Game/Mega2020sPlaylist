<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Cross-Playlist Jukebox</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            width: 1200px;
            max-width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        .player-section {
            flex: 1;
            min-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .now-playing-banner {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 14px;
            color: #ddd;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-sizing: border-box;
        }
        .now-playing-banner span.label {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .now-playing-banner span.title {
            font-weight: bold;
            color: #ff7777;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        /* Silent Loading Overlay Screen */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #161616;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #333;
            border-top: 3px solid #ff0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 14px;
            color: #aaa;
            font-family: monospace;
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #121212;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #ff0000;
        }
        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cc0000;
        }
        button.secondary {
            background-color: #333;
        }
        button.secondary:hover {
            background-color: #444;
        }
        .text-log-section {
            width: 320px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            max-height: 580px;
        }
        .text-log-section h3 {
            margin-top: 0;
            font-size: 15px;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        #playlist-queue-list {
            flex: 1;
            background: #121212;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .queue-item {
            background: #1a1a1a;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .queue-item span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
        }
        .helper-text {
            font-size: 13px;
            color: #888;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <!-- Left Column: Player & Controls -->
        <div class="player-section">
            <div class="now-playing-banner">
                <span class="label">Now Playing</span>
                <span id="current-song-title" class="title">Waiting for playback to begin...</span>
            </div>

            <div id="player-container">
                <!-- Silent Loading Overlay -->
                <div id="loading-overlay" class="hidden">
                    <div class="spinner"></div>
                    <span id="overlay-status" class="loading-text">Indexing playlists...</span>
                </div>
                <div id="youtube-player"></div>
            </div>

            <div class="control-panel">
                <p class="helper-text">Paste your Playlist URLs (one per line):</p>
                <textarea id="playlist-input" placeholder="https://www.youtube.com/playlist?list=PLxxxxxxxx...&#10;https://www.youtube.com/playlist?list=PLyyyyyyyy..."></textarea>
                <div class="button-row">
                    <span id="status-display" class="helper-text">Ready.</span>
                    <div class="action-buttons">
                        <button class="secondary" onclick="playRandomMasterTrack()" title="Skip to a random track">Skip ⏭️</button>
                        <button onclick="initJukebox()">Start Jukebox 🔀</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Interactive Queue Manager -->
        <div class="text-log-section">
            <h3>Playlist Pool Status</h3>
            <div id="playlist-queue-list">
                <span style="color: #666; text-align: center; margin-top: 40px;">No playlists loaded yet.</span>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API Script Loader -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        let playlistPool = [];
        let masterTrackPool = [];
        let currentPlaylistIndex = 0;
        let isJukeboxActive = false;
        let titleInterval = null;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'enablejsapi': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function extractPlaylistId(input) {
            input = input.trim();
            if (input.includes('list=')) {
                try {
                    const url = new URL(input.startsWith('http') ? input : 'https://www.youtube.com' + input);
                    return url.searchParams.get('list');
                } catch (e) {
                    return null;
                }
            }
            return input.length > 5 ? input : null;
        }

        function initJukebox() {
            const rawText = document.getElementById('playlist-input').value;
            const lines = rawText.split(/[\n,]+/);
            playlistPool = lines.map(item => extractPlaylistId(item)).filter(Boolean);
            playlistPool = [...new Set(playlistPool)];

            if (playlistPool.length === 0) {
                alert('Please enter at least one valid playlist URL.');
                return;
            }

            isJukeboxActive = true;
            masterTrackPool = [];
            currentPlaylistIndex = 0;
            
            // Show the silent loading overlay screen
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.remove('hidden');
            document.getElementById('overlay-status').innerText = `Indexing playlist 1 of ${playlistPool.length}...`;
            document.getElementById('status-display').innerText = `Indexing playlists...`;

            loadNextPlaylistForIndexing();
        }

        function loadNextPlaylistForIndexing() {
            if (currentPlaylistIndex < playlistPool.length) {
                document.getElementById('overlay-status').innerText = `Indexing playlist ${currentPlaylistIndex + 1} of ${playlistPool.length}...`;
                const targetId = playlistPool[currentPlaylistIndex];
                player.loadPlaylist({
                    list: targetId,
                    listType: 'playlist',
                    index: 0
                });
                setTimeout(harvestTracksFromCurrentPlayer, 1500);
            } else {
                if (masterTrackPool.length > 0) {
                    // Hide the loading overlay before starting playback
                    document.getElementById('loading-overlay').classList.add('hidden');
                    playRandomMasterTrack();
                } else {
                    document.getElementById('loading-overlay').classList.add('hidden');
                    alert('Could not index tracks. Make sure the playlist links are public.');
                }
            }
        }

        function harvestTracksFromCurrentPlayer() {
            try {
                const fetchedTracks = player.getPlaylist();
                if (fetchedTracks && Array.isArray(fetchedTracks)) {
                    masterTrackPool.push(...fetchedTracks);
                }
            } catch (e) {
                console.log('Error harvesting playlist:', e);
            }

            currentPlaylistIndex++;
            if (currentPlaylistIndex < playlistPool.length) {
                loadNextPlaylistForIndexing();
            } else {
                masterTrackPool = [...new Set(masterTrackPool)];
                renderQueueUI();
                document.getElementById('loading-overlay').classList.add('hidden');
                playRandomMasterTrack();
            }
        }

        function playRandomMasterTrack() {
            if (!isJukeboxActive || masterTrackPool.length === 0) return;

            const randomIndex = Math.floor(Math.random() * masterTrackPool.length);
            const targetVideoId = masterTrackPool[randomIndex];

            document.getElementById('status-display').innerText = `Active mix (${masterTrackPool.length} tracks)`;
            player.loadVideoById(targetVideoId);

            fetchVideoTitle();
        }

        function fetchVideoTitle() {
            if (titleInterval) clearInterval(titleInterval);
            
            let attempts = 0;
            titleInterval = setInterval(() => {
                attempts++;
                try {
                    const data = player.getVideoData();
                    if (data && data.title && data.title !== "") {
                        document.getElementById('current-song-title').innerText = data.title;
                        clearInterval(titleInterval);
                    }
                } catch (e) {}
                if (attempts > 20) {
                    clearInterval(titleInterval);
                }
            }, 300);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED && isJukeboxActive) {
                playRandomMasterTrack();
            }
        }

        function renderQueueUI() {
            const container = document.getElementById('playlist-queue-list');
            let html = `<strong>Indexed Playlists:</strong> ${playlistPool.length}<br><strong>Total Songs Found:</strong> ${masterTrackPool.length}<br><hr style="border-color:#333; margin:8px 0;">`;
            
            playlistPool.forEach((id, idx) => {
                html += `
                    <div class="queue-item">
                        <span title="${id}">#${idx + 1}: ${id}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>

</body>
</html>
