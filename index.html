<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robust Playlist Amalgamator</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #player-container {
            width: 850px;
            max-width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .control-panel {
            width: 850px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
            border: 1px solid #333;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: #121212;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #ff0000;
        }
        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cc0000;
        }
        .helper-text {
            font-size: 13px;
            color: #888;
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <iframe id="youtube-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <div class="control-panel">
        <p class="helper-text">Paste a YouTube Playlist URL below:</p>
        <textarea id="playlist-input" placeholder="https://www.youtube.com/playlist?list=PLxxxxxxxx..."></textarea>
        <div class="button-row">
            <span id="status-display" class="helper-text">Ready.</span>
            <button onclick="loadPlaylistDirectly()">Load Playlist</button>
        </div>
    </div>

    <script>
        function extractPlaylistId(input) {
            input = input.trim();
            if (input.includes('list=')) {
                try {
                    const url = new URL(input.startsWith('http') ? input : 'https://www.youtube.com' + input);
                    return url.searchParams.get('list');
                } catch (e) {
                    return null;
                }
            }
            return input.length > 5 ? input : null;
        }

        function loadPlaylistDirectly() {
            const rawText = document.getElementById('playlist-input').value;
            const playlistId = extractPlaylistId(rawText);

            if (!playlistId) {
                alert('Please enter a valid playlist URL or ID.');
                return;
            }

            // Construct the direct embed URL syntax that YouTube natively accepts without silent drops
            const embedUrl = `https://www.youtube.com/embed/videoseries?list=${playlistId}&autoplay=1`;
            
            document.getElementById('youtube-iframe').src = embedUrl;
            document.getElementById('status-display').innerText = `Loaded playlist: ${playlistId}`;
        }
    </script>

</body>
</html>
