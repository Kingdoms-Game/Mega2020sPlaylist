<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Jukebox Shell</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            width: 1200px;
            max-width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        .player-section {
            flex: 1;
            min-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: #121212;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #ff0000;
        }
        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cc0000;
        }
        button.secondary {
            background-color: #333;
        }
        button.secondary:hover {
            background-color: #444;
        }
        /* Sidebar Panel */
        .text-log-section {
            width: 320px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            max-height: 540px;
        }
        .text-log-section h3 {
            margin-top: 0;
            font-size: 15px;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        #playlist-queue-list {
            flex: 1;
            background: #121212;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .queue-item {
            background: #1a1a1a;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .queue-item span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
        }
        .queue-item button {
            padding: 4px 8px;
            font-size: 11px;
        }
        .helper-text {
            font-size: 13px;
            color: #888;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <!-- Left Column: Player & Controls -->
        <div class="player-section">
            <div id="player-container">
                <iframe id="youtube-iframe" 
                        src="about:blank" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>
            </div>

            <div class="control-panel">
                <p class="helper-text">Paste your Playlist URLs (one per line):</p>
                <textarea id="playlist-input" placeholder="https://www.youtube.com/playlist?list=PLxxxxxxxx...&#10;https://www.youtube.com/playlist?list=PLyyyyyyyy..."></textarea>
                <div class="button-row">
                    <span id="status-display" class="helper-text">Ready.</span>
                    <div class="btn-group">
                        <button class="secondary" onclick="loadJukebox(false)">Load Queue</button>
                        <button onclick="loadJukebox(true)">Shuffle Playlists 🔀</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Interactive Queue Manager -->
        <div class="text-log-section">
            <h3>Playlist Queue Deck</h3>
            <div id="playlist-queue-list">
                <span style="color: #666; text-align: center; margin-top: 40px;">No playlists loaded yet.</span>
            </div>
        </div>
    </div>

    <script>
        let parsedPlaylists = [];
        let activeIndex = 0;

        function extractPlaylistId(input) {
            input = input.trim();
            if (input.includes('list=')) {
                try {
                    const url = new URL(input.startsWith('http') ? input : 'https://www.youtube.com' + input);
                    return url.searchParams.get('list');
                } catch (e) {
                    return null;
                }
            }
            return input.length > 5 ? input : null;
        }

        function loadJukebox(isShuffled) {
            const rawText = document.getElementById('playlist-input').value;
            const lines = rawText.split(/[\n,]+/);
            parsedPlaylists = lines.map(item => extractPlaylistId(item)).filter(Boolean);
            parsedPlaylists = [...new Set(parsedPlaylists)];

            if (parsedPlaylists.length === 0) {
                alert('Please enter at least one valid playlist URL.');
                return;
            }

            if (isShuffled) {
                for (let i = parsedPlaylists.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [parsedPlaylists[i], parsedPlaylists[j]] = [parsedPlaylists[j], parsedPlaylists[i]];
                }
            }

            activeIndex = 0;
            playPlaylistAtIndex(activeIndex);
            renderQueueUI();
        }

        function playPlaylistAtIndex(index) {
            if (index < 0 || index >= parsedPlaylists.length) return;
            activeIndex = index;

            const targetId = parsedPlaylists[activeIndex];
            const currentOrigin = window.location.origin === 'file://' ? '*' : window.location.origin;

            // Load the chosen playlist into the frame
            const embedUrl = `https://www.youtube-nocookie.com/embed/videoseries?list=${targetId}&autoplay=1&enablejsapi=1&origin=${encodeURIComponent(currentOrigin)}`;
            
            document.getElementById('youtube-iframe').src = embedUrl;
            document.getElementById('status-display').innerText = `Playing Playlist (${activeIndex + 1} of ${parsedPlaylists.length})`;

            renderQueueUI();
        }

        function renderQueueUI() {
            const container = document.getElementById('playlist-queue-list');
            if (parsedPlaylists.length === 0) {
                container.innerHTML = `<span style="color: #666; text-align: center; margin-top: 40px;">No playlists loaded yet.</span>`;
                return;
            }

            let html = '';
            parsedPlaylists.forEach((id, idx) => {
                const isCurrent = idx === activeIndex;
                html += `
                    <div class="queue-item" style="border-color: ${isCurrent ? '#ff0000' : '#333'}">
                        <span title="${id}">#${idx + 1}: ${id}</span>
                        <button onclick="playPlaylistAtIndex(${idx})" style="background-color: ${isCurrent ? '#ff0000' : '#333'}">
                            ${isCurrent ? 'Playing' : 'Jump'}
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>

</body>
</html>
