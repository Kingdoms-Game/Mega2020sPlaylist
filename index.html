<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True Random Cross-Queue Amalgamator</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            width: 1200px;
            max-width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        .player-section {
            flex: 1;
            min-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #121212;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #ff0000;
        }
        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cc0000;
        }
        button.secondary {
            background-color: #333;
        }
        button.secondary:hover {
            background-color: #444;
        }
        .text-log-section {
            width: 300px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            max-height: 550px;
        }
        .text-log-section h3 {
            margin-top: 0;
            font-size: 15px;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        #text-readout {
            flex: 1;
            background: #121212;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #ccc;
            word-break: break-all;
        }
        .helper-text {
            font-size: 13px;
            color: #888;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <!-- Left Column: Player & Controls -->
        <div class="player-section">
            <div id="player-container">
                <iframe id="youtube-iframe" 
                        src="about:blank" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>
            </div>

            <div class="control-panel">
                <p class="helper-text">Paste YouTube Video URLs (mix links from any number of playlists):</p>
                <textarea id="playlist-input" placeholder="https://www.youtube.com/watch?v=xxxxx&#10;https://youtu.be/yyyyy&#10;https://www.youtube.com/watch?v=zzzzz"></textarea>
                <div class="button-row">
                    <span id="status-display" class="helper-text">Ready.</span>
                    <div class="btn-group">
                        <button class="secondary" onclick="loadQueue(false)">Play in Order</button>
                        <button onclick="loadQueue(true)">True Shuffle All 🔀</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Text Readout Log -->
        <div class="text-log-section">
            <h3>Active Queue Order</h3>
            <div id="text-readout">No tracks loaded yet.</div>
        </div>
    </div>

    <script>
        function extractVideoId(input) {
            input = input.trim();
            // Handle standard watch links, short links, and embed links
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = input.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (input.length === 11 ? input : null);
        }

        function shuffleArray(array) {
            // Fisher-Yates shuffle algorithm for true random distribution
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function loadQueue(isShuffled) {
            const rawText = document.getElementById('playlist-input').value;
            const lines = rawText.split(/[\n,]+/);
            let videoIds = lines.map(item => extractVideoId(item)).filter(Boolean);

            // Remove duplicate entries if any
            videoIds = [...new Set(videoIds)];

            if (videoIds.length === 0) {
                alert('Please enter at least one valid YouTube video URL.');
                return;
            }

            if (isShuffled) {
                shuffleArray(videoIds);
            }

            const currentOrigin = window.location.origin === 'file://' ? '*' : window.location.origin;
            
            // YouTube embeds accept a comma-separated list of video IDs to form a custom queue
            const firstVideo = videoIds[0];
            const remainingVideos = videoIds.slice(1).join(',');
            
            let embedUrl = `https://www.youtube-nocookie.com/embed/${firstVideo}?autoplay=1&enablejsapi=1&origin=${encodeURIComponent(currentOrigin)}`;
            
            if (remainingVideos.length > 0) {
                embedUrl += `&playlist=${remainingVideos}`;
            }

            document.getElementById('youtube-iframe').src = embedUrl;
            document.getElementById('status-display').innerText = isShuffled ? `Playing Shuffled Mix (${videoIds.length} tracks)` : `Playing In Order (${videoIds.length} tracks)`;

            // Update the sidebar text log to show the exact randomized order
            let logHtml = `<strong>Total Tracks:</strong> ${videoIds.length}<br><br><strong>Queue Sequence:</strong><br><ol style="padding-left: 20px; margin: 5px 0;">`;
            videoIds.forEach((id, index) => {
                logHtml += `<li><a href="https://youtu.be/${id}" target="_blank" style="color: #ff7777;">${id}</a></li>`;
            });
            logHtml += `</ol>`;
            
            document.getElementById('text-readout').innerHTML = logHtml;
        }
    </script>

</body>
</html>
