<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Cross-Playlist Jukebox</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            width: 1200px;
            max-width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        .player-section {
            flex: 1;
            min-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
        }
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #121212;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #ff0000;
        }
        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cc0000;
        }
        .text-log-section {
            width: 320px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            max-height: 540px;
        }
        .text-log-section h3 {
            margin-top: 0;
            font-size: 15px;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        #playlist-queue-list {
            flex: 1;
            background: #121212;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #ccc;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .queue-item {
            background: #1a1a1a;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .queue-item span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
        }
        .helper-text {
            font-size: 13px;
            color: #888;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <!-- Left Column: Player & Controls -->
        <div class="player-section">
            <div id="player-container">
                <div id="youtube-player"></div>
            </div>

            <div class="control-panel">
                <p class="helper-text">Paste your Playlist URLs (one per line):</p>
                <textarea id="playlist-input" placeholder="https://www.youtube.com/playlist?list=PLxxxxxxxx...&#10;https://www.youtube.com/playlist?list=PLyyyyyyyy..."></textarea>
                <div class="button-row">
                    <span id="status-display" class="helper-text">Ready.</span>
                    <button onclick="initJukebox()">Start Autonomous Jukebox 🔀</button>
                </div>
            </div>
        </div>

        <!-- Right Column: Interactive Queue Manager -->
        <div class="text-log-section">
            <h3>Active Playlist Pool</h3>
            <div id="playlist-queue-list">
                <span style="color: #666; text-align: center; margin-top: 40px;">No playlists loaded yet.</span>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API Script Loader -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        let playlistPool = [];
        let isJukeboxActive = false;

        // Global callback required by the YouTube API
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'enablejsapi': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function extractPlaylistId(input) {
            input = input.trim();
            if (input.includes('list=')) {
                try {
                    const url = new URL(input.startsWith('http') ? input : 'https://www.youtube.com' + input);
                    return url.searchParams.get('list');
                } catch (e) {
                    return null;
                }
            }
            return input.length > 5 ? input : null;
        }

        function initJukebox() {
            const rawText = document.getElementById('playlist-input').value;
            const lines = rawText.split(/[\n,]+/);
            playlistPool = lines.map(item => extractPlaylistId(item)).filter(Boolean);
            playlistPool = [...new Set(playlistPool)];

            if (playlistPool.length === 0) {
                alert('Please enter at least one valid playlist URL.');
                return;
            }

            isJukeboxActive = true;
            renderQueueUI();
            playRandomPlaylist();
        }

        function playRandomPlaylist() {
            if (!isJukeboxActive || playlistPool.length === 0) return;

            // Pick a random playlist from the entered pool
            const randomIndex = Math.floor(Math.random() * playlistPool.length);
            const targetId = playlistPool[randomIndex];

            document.getElementById('status-display').innerText = `Switching to random playlist mix...`;

            if (player && typeof player.loadPlaylist === 'function') {
                // Load the new playlist queue
                player.loadPlaylist({
                    list: targetId,
                    listType: 'playlist',
                    index: 0,
                    autoplay: true
                });

                // Force shuffle mode ON by default upon load
                setTimeout(() => {
                    try {
                        player.setShuffle(true);
                        player.playVideoAt(0);
                    } catch (e) {
                        console.log('Shuffle applied:', e);
                    }
                }, 1000);
            }

            highlightActivePlaylist(targetId);
        }

        // Intercepts player events; triggers automatic random rotation when a track ends
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED && isJukeboxActive) {
                playRandomPlaylist();
            }
        }

        function highlightActivePlaylist(activeId) {
            const container = document.getElementById('playlist-queue-list');
            let html = '';
            playlistPool.forEach((id, idx) => {
                const isActive = id === activeId;
                html += `
                    <div class="queue-item" style="border-color: ${isActive ? '#ff0000' : '#333'}">
                        <span title="${id}">#${idx + 1}: ${id}</span>
                        <span style="color: ${isActive ? '#ff7777' : '#666'}; font-size: 11px;">
                            ${isActive ? 'ACTIVE' : ''}
                        </span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderQueueUI() {
            const container = document.getElementById('playlist-queue-list');
            let html = '';
            playlistPool.forEach((id, idx) => {
                html += `
                    <div class="queue-item">
                        <span title="${id}">#${idx + 1}: ${id}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>

</body>
</html>
